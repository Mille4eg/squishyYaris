
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Squishy Yaris</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Squishy Yaris</h1>

    <img
        src="https://d36dyyw8x5qpnf.cloudfront.net/photos_new/2024-09-28/toyota-yaris-g-375591.png"
        class="squishy-car"
        alt="Why's this dealer? Taking the piss? I've been standing here. For 30 minutes."
    >

    <div class="music-controls">
        <button id="play-button">▶</button>

        <label for="volume">🔊</label>
        <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="50"
        >
    </div>

    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>

</body>
</html>
